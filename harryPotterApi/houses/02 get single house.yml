info:
  name: get single house
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/houses/1
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });
        
        test("house 1 er Gryffindor", function () {
          expect(res.body.id).to.equal(1);
          expect(res.body.name).to.equal("Gryffindor");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

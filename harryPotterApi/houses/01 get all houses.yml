info:
  name: get all houses
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/houses/7
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });

        test("returnerer de 4 houses", function () {
          expect(res.body).to.be.an("array").with.lengthOf(4);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: read course after add
  type: http
  seq: 14

http:
  method: GET
  url: http://localhost:3000/courses/2
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });

        test("student 4 er tilføjet", function () {
          const ids = res.body.students.map((s) => s.id).sort();
          expect(ids).to.deep.equal([1, 2, 3, 4]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

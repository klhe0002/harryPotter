info:
  name: update course name
  type: http
  seq: 5

http:
  method: PUT
  url: http://localhost:3000/courses/{{courseId}}
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Advanced Herbology"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });

        test("navnet er ændret", function () {
          expect(res.body.name).to.equal("Advanced Herbology");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

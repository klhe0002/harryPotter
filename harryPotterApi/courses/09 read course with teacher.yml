info:
  name: read course with teacher
  type: http
  seq: 9

http:
  method: GET
  url: http://localhost:3000/courses/2
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });
        
        test("Potions har Snape som teacher", function () {
          expect(res.body.name).to.equal("Potions");
          expect(res.body.teacher.id).to.equal(2);
          expect(res.body.teacher.name).to.equal("Severus Snape");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

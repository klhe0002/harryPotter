info:
  name: update course
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:3000/courses/{{courseId}}
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Advanced Astronomy",
        "fk_teachers": 15,
        "type": "elective",
        "level": "NEWT",
        "school_year": 6
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });
        
        test("course er ændret", function () {
          expect(res.body.name).to.equal("Advanced Astronomy");
          expect(res.body.type).to.equal("elective");
          expect(res.body.level).to.equal("NEWT");
          expect(res.body.school_year).to.equal(6);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

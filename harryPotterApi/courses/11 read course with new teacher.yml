info:
  name: read course with new teacher
  type: http
  seq: 11

http:
  method: GET
  url: http://localhost:3000/courses/2
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });
        
        test("teacher er skiftet til Flitwick (id 4)", function () {
          expect(res.body.teacher.id).to.equal(4);
          expect(res.body.teacher.name).to.equal("Filius Flitwick");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

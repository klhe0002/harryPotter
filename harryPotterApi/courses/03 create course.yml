info:
  name: create course
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/courses
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Herbology"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("courseId", res.body.id);
    - type: tests
      code: |-
        test("status er 201", function () {
          expect(res.status).to.equal(201);
        });

        test("returnerer det nye course med id", function () {
          expect(res.body.id).to.be.a("number");
          expect(res.body.name).to.equal("Herbology");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: create student
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/students
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Neville Longbottom",
        "year": 1,
        "fk_houses": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("studentId", res.body.id);
    - type: tests
      code: |-
        test("status er 201", function () {
          expect(res.status).to.equal(201);
        });
        
        test("returnerer den nye student med id", function () {
          expect(res.body.id).to.be.a("number");
          expect(res.body.name).to.equal("Neville Longbottom");
          expect(res.body.year).to.equal(1);
          expect(res.body.fk_houses).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

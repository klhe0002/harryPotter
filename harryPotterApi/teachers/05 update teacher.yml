runtime:
  scripts:
    - type: tests
      code: |-
        test("status er 200", function () {
          expect(res.status).to.equal(200);
        });

        test("returnerer den ændrede teacher", function () {
          expect(res.body.name).to.equal("Filius Flitwick");
          expect(res.body.fk_houses).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true

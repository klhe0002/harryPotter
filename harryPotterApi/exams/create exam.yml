info:
  name: create exam
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/exams
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fk_course": 1,
        "fk_student": 1,
        "fk_grade": "T"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("examId", res.body.id);
    - type: tests
      code: |-
        test("status er 201", function () {
          expect(res.status).to.equal(201);
        });

        test("returnerer den nye exam med id", function () {
          expect(res.body.id).to.be.a("number");
          expect(res.body.course).to.equal("Transfiguration");
          expect(res.body.student).to.equal("Harry Potter");
          expect(res.body.grade).to.equal("T");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
